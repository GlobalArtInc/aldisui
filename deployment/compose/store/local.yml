version: "3.4"

volumes:
  mariadb:
  postgres:

services:
  mariadb:
    image: mariadb:10.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: aldis
      MARIADB_PASSWORD: aldis
      MARIADB_DATABASE: aldis
    volumes:
      - mariadb:/var/lib/mysql
    ports:
      - 3306:3306

  postgres:
    image: postgres:14.3
    restart: always
    environment:
      POSTGRES_USER: aldis
      POSTGRES_PASSWORD: aldis
      POSTGRES_DB: aldis
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - 5432:5432
