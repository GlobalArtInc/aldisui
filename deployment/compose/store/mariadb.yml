version: "3.4"

volumes:
  mariadb:

services:
  server:
    environment:
      ALDIS_DB_DIALECT: mysql
      ALDIS_DB_HOST: db
      ALDIS_DB_PORT: 3306
      ALDIS_DB_USER: ${MARIADB_USERNAME:-aldis}
      ALDIS_DB_PASS: ${MARIADB_PASSWORD:-aldis}
      ALDIS_DB: ${MARIADB_DATABASE:-aldis}
    depends_on:
      - db

  db:
    image: mariadb:10.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT:-root}
      MARIADB_USER: ${MARIADB_USERNAME:-aldis}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-aldis}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-aldis}
    volumes:
      - mariadb:/var/lib/mysql
