version: "3.4"

volumes:
  mysql:

services:
  server:
    environment:
      ALDIS_DB_DIALECT: mysql
      ALDIS_DB_HOST: db
      ALDIS_DB_PORT: 3306
      ALDIS_DB_USER: ${MYSQL_USERNAME:-aldis}
      ALDIS_DB_PASS: ${MYSQL_PASSWORD:-aldis}
      ALDIS_DB: ${MYSQL_DATABASE:-aldis}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT:-root}
      MYSQL_USER: ${MYSQL_USERNAME:-aldis}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aldis}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aldis}
    volumes:
      - mysql:/var/lib/mysql
