<ui-shell
  [sections]="sections()"
  [brand]="project()?.name ?? ('aldis' | translate)"
  [section]="'project' | translate"
  brandHref="/">
  <div shellTopbarEnd class="flex items-center gap-2">
    <button uiButton variant="ghost" size="sm" type="button" (click)="goToProjects()">
      <ui-icon name="arrow-left" [size]="15"></ui-icon>
      {{ 'projects' | translate }}
    </button>

    @if (user(); as current) {
      <span class="hidden text-sm text-ink-muted sm:inline">{{ current.name }}</span>
    }

    <button uiButton variant="ghost" size="icon-sm" type="button" [attr.aria-label]="'signOut' | translate" (click)="signOut()">
      <ui-icon name="log-out" [size]="15"></ui-icon>
    </button>
  </div>

  <div class="flex flex-col gap-6">
    <router-outlet />
  </div>
</ui-shell>
