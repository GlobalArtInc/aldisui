<ui-shell #shell [sections]="sections()" [brand]="'aldis' | translate" brandHref="/">
  <div shellSidebarHeader class="p-3">
    <ui-menu align="start" width="w-64" [full]="true">
      <button
        menuTrigger
        type="button"
        class="flex w-full items-center gap-3 rounded-control px-2 py-2 text-left transition-colors hover:bg-surface-hover"
        [class.justify-center]="shell.railed()"
        [attr.title]="shell.railed() ? project()?.name : null">
        <ui-avatar [name]="project()?.name ?? ''" size="sm"></ui-avatar>

        @if (!shell.railed()) {
          <span class="flex min-w-0 flex-1 flex-col">
            <span class="truncate font-medium text-ink">{{ project()?.name }}</span>
            <span class="truncate text-sm text-ink-muted">{{ role() }}</span>
          </span>
          <ui-icon name="chevron-down" [size]="14"></ui-icon>
        }
      </button>

      <div menuContent>
        @for (item of all(); track item.id) {
          <button uiMenuItem type="button" (click)="goToProject(item.id)">
            <ui-avatar [name]="item.name" size="sm"></ui-avatar>
            <span class="truncate">{{ item.name }}</span>
          </button>
        }

        <span uiMenuSeparator></span>

        <button uiMenuItem type="button" (click)="dialog.set('create')">
          <ui-icon name="plus" [size]="15"></ui-icon>
          {{ 'newProject' | translate }}
        </button>
        <button uiMenuItem type="button" (click)="dialog.set('restore')">
          <ui-icon name="refresh-cw" [size]="15"></ui-icon>
          {{ 'restoreProject' | translate }}
        </button>
      </div>
    </ui-menu>
  </div>

  <div shellTopbarEnd class="flex items-center gap-2">
    <aldis-theme-toggle></aldis-theme-toggle>
    <aldis-language-menu></aldis-language-menu>

    @if (user(); as current) {
      <span class="hidden text-sm text-ink-muted sm:inline">{{ current.name }}</span>
    }

    <button
      uiButton
      variant="ghost"
      size="icon-sm"
      type="button"
      [attr.aria-label]="'signOut' | translate"
      (click)="signOut()">
      <ui-icon name="log-out" [size]="15"></ui-icon>
    </button>
  </div>

  <div class="flex flex-col gap-6">
    <router-outlet />
  </div>

  <aldis-task-dialog></aldis-task-dialog>
  <aldis-project-dialog [mode]="dialog()" (closed)="dialog.set(null)"></aldis-project-dialog>
</ui-shell>
