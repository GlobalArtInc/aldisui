<div class="flex min-h-screen flex-col bg-surface-sunken">
  <header class="flex items-center justify-between border-b border-line bg-surface px-6 py-3">
    <a routerLink="/" class="text-lg font-semibold tracking-wide text-ink">{{ 'aldis' | translate }}</a>

    <div class="flex items-center gap-3">
      <aldis-theme-toggle></aldis-theme-toggle>
      <aldis-language-menu></aldis-language-menu>

      @if (user(); as current) {
        <span class="text-sm text-ink-muted">{{ current.name }}</span>
      }
      <button uiButton variant="ghost" size="sm" type="button" (click)="signOut()">
        {{ 'signOut' | translate }}
      </button>
    </div>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>
</div>
