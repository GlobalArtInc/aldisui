<div class="flex min-h-screen items-center justify-center p-6">
  <ui-card class="w-full max-w-sm" [heading]="'signIn' | translate">
    @if (failed()) {
      <ui-alert tone="danger" class="mb-4">{{ 'incorrectUsrPwd' | translate }}</ui-alert>
    }

    @if (metadata()?.login_with_password !== false) {
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
        <ui-form-field [label]="'username' | translate" [control]="form.controls.auth">
          <input type="text" formControlName="auth" autocomplete="username" />
        </ui-form-field>

        <ui-form-field [label]="'password' | translate" [control]="form.controls.password">
          <input type="password" formControlName="password" autocomplete="current-password" />
        </ui-form-field>

        <button uiButton variant="primary" type="submit" [loading]="busy()">
          {{ 'signIn' | translate }}
        </button>
      </form>
    }

    @for (provider of metadata()?.oidc_providers ?? []; track provider.id) {
      <button uiButton variant="secondary" class="mt-3 w-full" (click)="signInWith(provider.id)">
        {{ provider.name }}
      </button>
    }
  </ui-card>
</div>
