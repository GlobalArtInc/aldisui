<ui-page-header [eyebrow]="'project' | translate" [heading]="'taskTemplates' | translate">
  <button uiButton variant="primary" type="button" (click)="create()">
    <ui-icon name="plus" [size]="15"></ui-icon>
    {{ 'newTemplate' | translate }}
  </button>
</ui-page-header>

<ui-data-table
  [columns]="columns()"
  [rows]="templates()"
  [rowTemplate]="templateRow"
  [rowSearch]="rowSearch"
  [rowAccent]="accent"
  density="compact"
  [pageSize]="20"
  emptyIcon="file-text"
  [searchPlaceholder]="'search' | translate"
  [emptyHeading]="'noTemplates' | translate">
</ui-data-table>

<ng-template #templateRow let-template>
  <td uiTd class="font-mono text-sm text-ink-muted">{{ template.id }}</td>
  <td uiTd>
    <a class="font-medium text-ink hover:text-signal" [routerLink]="[template.id]">{{ template.name }}</a>
    @if (template.description) {
      <span class="block truncate text-sm text-ink-muted">{{ template.description }}</span>
    }
  </td>
  <td uiTd class="font-mono text-sm text-ink-muted">{{ template.playbook }}</td>
  <td uiTd>
    <ui-badge tone="neutral">{{ template.app || template.type || 'ansible' }}</ui-badge>
  </td>
  <td uiTd>
    @if (template.last_task; as last) {
      <a [routerLink]="[]" [queryParams]="{ t: last.id }">
        <ui-badge [tone]="statusTone(last.status)">{{ statusLabel(last.status) | translate }}</ui-badge>
      </a>
    } @else {
      <span class="text-sm text-ink-faint">{{ 'none' | translate }}</span>
    }
  </td>
  <td uiTd class="text-right whitespace-nowrap">
    <button uiButton variant="secondary" size="sm" type="button" (click)="open(template)">
      <ui-icon name="arrow-right" [size]="15"></ui-icon>
      {{ 'run' | translate }}
    </button>
    <button
      uiButton
      variant="ghost"
      size="icon-sm"
      type="button"
      [attr.aria-label]="'edit' | translate"
      (click)="edit(template)">
      <ui-icon name="pencil" [size]="15"></ui-icon>
    </button>
    <button
      uiButton
      variant="ghost-danger"
      size="icon-sm"
      type="button"
      [attr.aria-label]="'deleteTemplate' | translate"
      (click)="removing.set(template)">
      <ui-icon name="trash-2" [size]="15"></ui-icon>
    </button>
  </td>
</ng-template>

<aldis-run-task-dialog
  [projectId]="projectId"
  [template]="selected()"
  (started)="started($event)"
  (closed)="selected.set(null)"></aldis-run-task-dialog>

<aldis-template-dialog
  [projectId]="projectId"
  [template]="editing()"
  [opened]="formOpen()"
  (saved)="saved()"
  (closed)="close()"></aldis-template-dialog>

<ui-confirm-modal
  [open]="!!removing()"
  [title]="'deleteTemplate' | translate"
  [question]="'askDeleteTemp' | translate"
  [confirmLabel]="'yes' | translate"
  [cancelLabel]="'cancel' | translate"
  [destructive]="true"
  (confirmed)="remove()"
  (closed)="removing.set(null)"></ui-confirm-modal>
