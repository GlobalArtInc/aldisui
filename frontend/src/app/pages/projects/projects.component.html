<div class="mx-auto flex w-full max-w-6xl flex-col gap-6 px-6 py-8">
  <ui-page-header [eyebrow]="'aldis' | translate" [heading]="'projects' | translate"></ui-page-header>

  @if (loading()) {
    <ui-spinner></ui-spinner>
  } @else if (projects().length === 0) {
    <ui-empty-state icon="layout-dashboard" [heading]="'newProject' | translate"></ui-empty-state>
  } @else {
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (project of projects(); track project.id) {
        <a class="block transition-transform hover:-translate-y-0.5" [routerLink]="['/project', project.id]">
          <ui-card [heading]="project.name" [eyebrow]="'project' | translate">
            <div class="flex items-center justify-between gap-3">
              <ui-badge tone="neutral">{{ project.type || 'ansible' }}</ui-badge>
              <span class="font-mono text-sm text-ink-muted">{{ project.created | date: 'dd.MM.yyyy' }}</span>
            </div>

            <div class="mt-3 flex items-center gap-2 text-sm text-ink-muted">
              <ui-icon name="layout-dashboard" [size]="15"></ui-icon>
              {{ 'dashboard' | translate }}
            </div>
          </ui-card>
        </a>
      }
    </div>
  }
</div>
